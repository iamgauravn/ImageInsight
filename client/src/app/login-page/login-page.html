<form class="container mt-5">
    <div class="form-group">
        <label for="exampleInputEmail1">Email Username</label>
        <input type="text" class="form-control" placeholder="Enter usrename" [(ngModel)]="userName" name="userName">
    </div>
    <div class="form-group mt-2">
        <label for="exampleInputPassword1">Password</label>
        <input type="password" class="form-control" placeholder="Password" [(ngModel)]="password" name="password">
    </div>
    <button type="submit" class="btn btn-primary mt-2" (click)="login()">Login</button>
</form>
